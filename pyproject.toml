[project]
name = "effi-agent"
version = "0.1.0"
description = "EffiGov LiveKit resident voice agent"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents>=1.6.9",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "livekit-plugins-cartesia>=1.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
